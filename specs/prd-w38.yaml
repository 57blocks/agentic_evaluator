# PRD step: no deterministic required checks exist yet, so every trial's
# task_outcome is `undetermined` by the success-decision contract. The step is
# still judged (pairwise + absolute) and costed; it demonstrates that a step
# without gates cannot manufacture a success rate.

protocol_version: "0.4"
run_name: prd-w38
budget_usd: 6

workflow:
  control_candidate: sonnet-5
  steps:
    - id: prd
      version: "1"
      test_set:
        id: briefs-v1
        inputs: [todo-app, chat-app]
      candidate_ids: [sonnet-5, deepseek-v4-pro, kimi-k3]
      required_checks: []
      judged_dimensions: [completeness, testability, no-hallucination, structure]
      operating_mode: highest-assurance
      maximum_completion_time_seconds: 240

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0.3 }
  - id: deepseek-v4-pro
    model: deepseek/deepseek-v4-pro
    provider_route: openrouter
    generation_settings: { temperature: 0.3 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0.3 }

evaluators:
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/prd.md
    methods: [pairwise-swap, absolute-1-5]

execution:
  trials_per_case: 2
  concurrency: 3
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/prd.md
  default_temperature: 0.3
