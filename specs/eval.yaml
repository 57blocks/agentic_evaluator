# Compare two Claude Code configurations on the same coding tasks.
#
# Generation is local: each (candidate × input × trial) gets a clean temp dir,
# the task text is written to .eval-input.txt, your argv runs there, and every
# file the agent leaves behind is collected as the artifact set. Only the judge
# calls a paid API.
#
#   pnpm run run -- --suite specs/eval.yaml --html            # preview, free
#   caffeinate -i pnpm run run -- --suite specs/eval.yaml --html --yes

protocol_version: "0.4"
run_name: eval
budget_usd: 5

workflow:
  control_candidate: cc-sonnet
  steps:
    - id: codegen
      version: "1"
      test_set:
        id: code-v1
        inputs: [code-utils.agent]    # agent 版：要求它把文件写到磁盘
      candidate_ids: [cc-sonnet, cc-opus]
      required_checks: [tsc-noemit]
      judged_dimensions: [meets-spec, correctness, type-quality, simplicity, robustness]
      success_criteria:
        mandatory_checks: all
      # Not lowest-cost: agent-cli records cost 0 with source "none", so every
      # CLI candidate would tie as the cheapest and the choice would be noise.
      operating_mode: highest-assurance
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 300

candidates:
  # {{input}} is replaced with the task text, {{workdir}} with the temp dir.
  # Adjust the flags to whatever your installed Claude Code accepts.
  - id: cc-sonnet
    adapter: agent-cli
    cli:
      argv: [claude, -p, --model, claude-sonnet-5, --permission-mode, acceptEdits, "{{input}}"]
  - id: cc-opus
    adapter: agent-cli
    cli:
      argv: [claude, -p, --model, claude-opus-5, --permission-mode, acceptEdits, "{{input}}"]

evaluators:
  required_checks:
    tsc-noemit:
      kind: tsc
      scaffold_dir: scaffold
  judge:
    # Cross-vendor on purpose: neither candidate grades itself.
    model: openai/gpt-5.6-sol
    provider_route: openrouter
    rubric_file: rubrics/codegen.md
    methods: [pairwise-swap, absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 1
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: codegen
  default_temperature: 0.2
