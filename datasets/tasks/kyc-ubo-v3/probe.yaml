# kyc-ubo-v3 probe (2026-11-19): the four noisiest dev items of each archetype.
# Three models, 32 dev inputs, no judge. Before anyone reviews v3:
# does noise make items ambiguous, and do the attacks separate models?
#
#   agenteval run datasets/tasks/kyc-ubo-v3/probe.yaml --yes --html   # billed, a few dollars

protocol_version: "0.3"
run_name: kyc-ubo-v3-probe
description: "Which model knows how German KYC identifies a company's beneficial owners (§ 3 GwG as the BVA Transparenzregister applies it), from messy register extracts? v2's rules and case types, 200 dev items stratified by case type, with mixed date and amount formats, unaligned tables, irrelevant register entries, missing details and scanned labels."
budget_usd: 8

workflow:
  control_candidate: opus-5.5
  steps:
    - id: ubo
      version: "1"
      producer: prompt
      prompt_file: prompts/ubo.md
      rubric_file: rubrics/ubo.md
      test_set:
        id: kyc-ubo-v3-dev
        items_file: kyc-ubo-v3.dev.jsonl
        inputs: [ubo3-d-aggr-09, ubo3-d-aggr-15, ubo3-d-aggr-17, ubo3-d-aggr-20, ubo3-d-kg-04, ubo3-d-kg-11, ubo3-d-kg-18, ubo3-d-kg-19, ubo3-d-noctl-08, ubo3-d-noctl-14, ubo3-d-noctl-05, ubo3-d-noctl-07, ubo3-d-bound-08, ubo3-d-bound-01, ubo3-d-bound-02, ubo3-d-bound-03, ubo3-d-norm-04, ubo3-d-norm-18, ubo3-d-norm-02, ubo3-d-norm-03, ubo3-d-own-08, ubo3-d-own-12, ubo3-d-own-13, ubo3-d-own-06, ubo3-d-twoveh-05, ubo3-d-twoveh-10, ubo3-d-twoveh-11, ubo3-d-twoveh-18, ubo3-d-vote-18, ubo3-d-vote-23, ubo3-d-vote-05, ubo3-d-vote-06]
      candidate_ids: [opus-5.5, gpt-5.6-sol, deepseek-v4.1-flash]
      required_checks: [ubo-check]
      success_criteria:
        mandatory_checks: all
      eligibility:
        minimum_required_check_pass_rate: 0.9
        minimum_reliability: 0.9
      operating_mode: lowest-cost
      maximum_completion_time_seconds: 300

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: glm-5.3
    model: z-ai/glm-5.3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4.1-flash
    model: deepseek/deepseek-v4.1-flash
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: opus-5.5
    model: anthropic/claude-opus-5.5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: gpt-5.6-sol
    model: openai/gpt-5.6-sol
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: qwen3.8-max
    model: qwen/qwen3.8-max-0902
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4-pro
    model: deepseek/deepseek-v4-pro-0813
    provider_route: openrouter
    generation_settings: { temperature: 0 }

evaluators:
  required_checks:
    ubo-check:
      kind: command
      description: "The set of beneficial owners and of fictitious beneficial owners matches the key computed from RULES.md, by name; the stated basis is left to the judge."
      argv: ["node", "checks/ubo-check.mjs"]
      version_files: [checks/ubo-check.mjs]
      timeout_seconds: 30
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/ubo.md
    methods: [absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/ubo.md
  default_temperature: 0
