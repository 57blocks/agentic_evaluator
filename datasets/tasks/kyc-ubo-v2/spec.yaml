# kyc-ubo-v2 — which model knows how German KYC works out beneficial owners?
#
# v1 stated its rules in the prompt and every model got 30/30. Here the
# prompt names only § 3 GwG and BVA practice; the rules the answer key follows
# are in RULES.md, each quoted from the statute or the BVA Transparenzregister
# FAQ (Stand 05.05.2023), and the candidate never sees them. Inputs are
# synthetic German register extracts with euro amounts, generated by
# gen/generate.mjs from a fixed seed; gen/solve.mjs computes every answer.
#
# 300 items (v2.1; ubo2-001…030 are v2's, unchanged): 100 ordinary items
# and 200 traps: 6.250 vs 6.251 of 25.000, direct and
# controlled stakes added, two controlled vehicles added beside a 50/50
# holding, non-voting shares, own shares left out of the base, the controller
# of a KG's general partner, and the fallback to the Geschäftsführer (not the
# Prokurist). A six-item hand-written probe of this design (kyc-ubo-v2-probe)
# split the models: two of four missed the two-vehicle case.
#
# Graded by script: who the owners and fictitious owners are. The stated basis
# is not graded (one ground is enough, FAQ Teil 1 B I Nr. 9); the judge reads
# it beside the check.
#
#   node datasets/tasks/kyc-ubo-v2/gen/generate.mjs     # rebuild the set (same seed, same set)
#   agenteval check-task datasets/tasks/kyc-ubo-v2            # free
#   agenteval run datasets/tasks/kyc-ubo-v2 --yes --html      # billed

protocol_version: "0.3"
run_name: kyc-ubo-v2
description: "Which model knows how German KYC identifies a company's beneficial owners (§ 3 GwG as the BVA Transparenzregister applies it)? 300 synthetic German register extracts with euro amounts; the prompt names the law but not its rules, which are in RULES.md, each quoted from the statute or the BVA FAQ. 100 ordinary items and 200 traps: nominal-amount boundaries, direct plus controlled stakes added, two controlled vehicles beside a 50/50 holding, non-voting shares, own shares, a KG's general partner, and the fallback."
budget_usd: 70

workflow:
  control_candidate: sonnet-5
