# claim-denials-snf-v2 — which model knows Medicare's rules well enough to
# triage a denied skilled-nursing claim?
#
# The probe (claim-denials-probe) gave each claim an excerpt of the payer's
# manual, and the four models went 23/24: with the rules in the file, triage
# is reading. Here, as in kyc-ubo-v2, the rules are not in the file. Every
# claim is Medicare fee-for-service Part A (bill type 0211); the remittance
# shows raw 835 codes, and the answer key follows RULES.md, each rule quoted
# from 42 CFR, the CMS manuals or the X12 code list. gen/rules.mjs computes
# every deadline.
#
# Eleven ordinary items (a paid duplicate, a claim filed late, an
# unprocessable MA130 claim) and nineteen where knowing the rule changes the
# answer: timely filing counted from the Through date, not the From date; a
# redetermination due 125 days after the remittance (120 from the presumed
# receipt 5 days later); a benefit-limit denial in what is really a new
# benefit period; days past day 100 of the same period; and a three-day stay
# that was met when counted from the inpatient admission order.
#
#   node datasets/tasks/claim-denials-snf-v2/gen/generate.mjs     # rebuild (same seed, same set)
#   agenteval check-task datasets/tasks/claim-denials-snf-v2            # free
#   agenteval run datasets/tasks/claim-denials-snf-v2 --yes --html      # billed

protocol_version: "0.3"
run_name: claim-denials-snf-v2
description: "Which model knows Medicare's rules well enough to triage a denied skilled-nursing claim? 30 synthetic Medicare fee-for-service Part A claims with raw 835 remittance codes and the facility's records, and no payer manual: the rules (42 CFR, the CMS manuals, the X12 code list) are in RULES.md and the model must know them. Eleven ordinary items; nineteen where the rule changes the answer: filing limits from the Through date, the redetermination deadline (125 days after the remittance), new benefit periods, days past day 100, and a three-day stay counted from the admission order."
budget_usd: 4

workflow:
  control_candidate: sonnet-5
  steps:
    - id: triage
      version: "1"
      producer: prompt
      prompt_file: prompts/triage.md
      rubric_file: rubrics/triage.md
      test_set:
        id: claim-denials-snf-v2
        labels_file: checks/manifest.json
        inputs: [cd2-001, cd2-002, cd2-003, cd2-004, cd2-005, cd2-006, cd2-007, cd2-008, cd2-009, cd2-010, cd2-011, cd2-012, cd2-013, cd2-014, cd2-015, cd2-016, cd2-017, cd2-018, cd2-019, cd2-020, cd2-021, cd2-022, cd2-023, cd2-024, cd2-025, cd2-026, cd2-027, cd2-028, cd2-029, cd2-030]
      candidate_ids: [sonnet-5, kimi-k3, glm-5.3, deepseek-v4.1-flash]
      required_checks: [triage-check]
      judged_dimensions: [sound-action]
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      maximum_completion_time_seconds: 300

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: glm-5.3
    model: z-ai/glm-5.3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4.1-flash
    model: deepseek/deepseek-v4.1-flash
    provider_route: openrouter
    generation_settings: { temperature: 0 }

evaluators:
  required_checks:
    triage-check:
      kind: command
      description: "Root cause, correctability, next action and deadline match the key computed from RULES.md; the deadline must be the last day the rules allow."
      argv: ["node", "checks/triage-check.mjs"]
      version_files: [checks/triage-check.mjs, checks/manifest.json]
      timeout_seconds: 30
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/triage.md
    methods: [absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/triage.md
  default_temperature: 0
