# claim-denials-snf-v2 — which model knows Medicare's rules well enough to
# triage a denied skilled-nursing claim?
#
# The probe (claim-denials-probe) gave each claim an excerpt of the payer's
# manual, and the four models went 23/24: with the rules in the file, triage
# is reading. Here, as in kyc-ubo-v2, the rules are not in the file. Every
# claim is Medicare fee-for-service Part A (bill type 0211); the remittance
# shows raw 835 codes, and the answer key follows RULES.md, each rule quoted
# from 42 CFR, the CMS manuals or the X12 code list. gen/rules.mjs computes
# every deadline.
#
# 300 items (v2.2; cd2-001…030 are v2.1's, unchanged): 110 ordinary items (a
# paid duplicate, a claim filed late, an unprocessable MA130 claim) and 190
# where knowing the rule changes the
# answer: timely filing counted from the Through date, not the From date; a
# redetermination due 125 days after the remittance (120 from the presumed
# receipt 5 days later); a benefit-limit denial in what is really a new
# benefit period; days past day 100 of the same period; and a three-day stay
# that was met when counted from the inpatient admission order.
#
# v2.3 (2026-10-28): the 2026-10-22 human review of the answer key found R1
# wrong on its remedy: a timely-filing determination has no appeal rights
# (42 CFR 405.926(n)); the contractor reopens it (405.980(c)(1), one year
# from the remittance). `reopening` was added to next_action and the 50
# filing-through-date keys changed; every input is unchanged. Runs before
# v2.3 graded those 50 items against the old `appeal` key.
#
#   node datasets/tasks/claim-denials-snf-v2/gen/generate.mjs     # rebuild (same seed, same set)
#   agenteval check-task datasets/tasks/claim-denials-snf-v2            # free
#   agenteval run datasets/tasks/claim-denials-snf-v2 --yes --html      # billed

protocol_version: "0.3"
run_name: claim-denials-snf-v2
description: "Which model knows Medicare's rules well enough to triage a denied skilled-nursing claim? 300 synthetic Medicare fee-for-service Part A claims with raw 835 remittance codes and the facility's records, and no payer manual: the rules (42 CFR, the CMS manuals, the X12 code list) are in RULES.md and the model must know them. 110 ordinary items; 190 where the rule changes the answer: filing limits from the Through date (and a reopening, not an appeal, when the contractor gets it wrong), the redetermination deadline (125 days after the remittance), new benefit periods, days past day 100, and a three-day stay counted from the admission order."
budget_usd: 70

workflow:
  control_candidate: sonnet-5
  steps:
    - id: triage
      version: "1"
      producer: prompt
      prompt_file: prompts/triage.md
