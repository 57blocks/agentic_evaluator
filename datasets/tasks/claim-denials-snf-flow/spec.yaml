    model: deepseek/deepseek-v4-pro-0813
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  # Not a model: RULES.md's deadline rules as date arithmetic, on the
  # deadline step only. Is an LLM needed once next_action is decided?
  - id: deadline-rules
    adapter: agent-cli
    cli:
      argv: [node, agents/deadline-rules.mjs]
      reports_usage: true
      version_files: [agents/deadline-rules.mjs]

evaluators:
  required_checks:
    flow-check:
      kind: command
      description: "Each step hands on what the next needs, matching the key computed from RULES.md: extract the reason, the dates and the records verbatim; decide correctable and next_action; deadline the last day the rules allow."
      argv: ["node", "checks/flow-check.mjs"]
      version_files: [checks/flow-check.mjs, checks/manifest.json]
      timeout_seconds: 30
  judge:
    # Required by the schema, never called: no method is declared. The
    # checks decide every step; action_note is not asked for.
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/none.md
    methods: []

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  default_temperature: 0
