# claim-denials-snf-flow — claim-denials-snf-v2 as a three-step workflow:
# which model should run each step, and does the per-step combination beat
# the best single model end to end?
#
#   extract    the claim file      → reason, dates, records verbatim
#   decide     extract's summary   → correctable, next_action   (the rules)
#   deadline   decide's answer     → deadline                   (date arithmetic)
#
# Same 300 claim files and the same key as v2.4 (gen/generate.mjs imports
# v2's generator and stops if a file or key differs). Each step is evaluated
# on its own inputs (the correct previous answer: inputs/<id>-decide.txt,
# <id>-deadline.txt), then the chain runs twice from the claim files: opus-5.5
# on every step, and each step's pick. A chained case fails at its first
# failed step. Across the steps the checks grade v2's four fields, but the
# chain is not v2's single call: decide sees extract's summary, not the claim.
# The deadline step also has a candidate that is not a model (deadline-rules).
#
# Why these steps: in the v2.3 run every model got root_cause right (0/2400
# wrong), next_action split models on the reopening rule, and deadline was
# the most missed field for every model but opus-5.5.
#
#   node datasets/tasks/claim-denials-snf-flow/gen/generate.mjs        # rebuild
#   agenteval check-task datasets/tasks/claim-denials-snf-flow          # free
#   agenteval run datasets/tasks/claim-denials-snf-flow --yes --html    # billed

protocol_version: "0.3"
run_name: claim-denials-snf-flow
description: "Which model should run each step of triaging a denied Medicare skilled-nursing claim, and does the per-step combination beat the best single model end to end? claim-denials-snf-v2's 300 claims in three steps: extract (the contractor's reason, the dates, the records), decide (correctable, next action, under rules the model must know) and deadline (the last day for that action), plus a non-model deadline calculator. The chain is compared with opus-5.5 on every step."
budget_usd: 250

workflow:
  # The best single model on claim-denials-snf-v2 (297/300 on v2.3): the arm
