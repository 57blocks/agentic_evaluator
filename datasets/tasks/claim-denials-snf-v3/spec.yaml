# claim-denials-snf-v3 — v2's Medicare SNF denial triage, rebuilt for the
# paper: a stratified split, per-item seeds, noisy claim files, and, beside
# the triage key, what a parse step would have to get right (codes and dates,
# the case's own records apart from the distractor ones, the identifying
# facts). The task itself is still one step: triage.
#
# Rules and case builders are v2's (RULES.md and gen/ in claim-denials-snf-v2,
# imported, not copied), so v3 answers follow the same rules as v2.4. Seven
# archetypes, each 30 dev / 10 calibration / 75 holdout: 4 of 7 are hard
# (57%). Noise (date formats that differ between header and records, 835
# segments on one line, distractor records, a missing non-key field,
# OCR-style swaps in labels) never touches a fact the answer depends on;
# each item's tags name the noise it got.
#
# This spec runs the dev split. The holdout is generated from a seed kept out
# of the repo and lives in holdout/ (gitignored); holdout.sha256 pins it.
#
#   node datasets/tasks/claim-denials-snf-v3/gen/generate.mjs     # rebuild
#   agenteval check-task datasets/tasks/claim-denials-snf-v3            # free
#   agenteval run datasets/tasks/claim-denials-snf-v3 --yes --html      # billed

protocol_version: "0.3"
run_name: claim-denials-snf-v3
description: "Which model knows Medicare's rules well enough to triage a denied skilled-nursing claim, from a messy claim file? v2's rules and case types (42 CFR, CMS manuals, X12), 210 dev items stratified by case type, with the noise of real claim files: mixed date formats, one-line 835s, irrelevant records, missing fields, scanned labels."
budget_usd: 50

workflow:
  control_candidate: sonnet-5
  steps:
    - id: triage
      version: "1"
      producer: prompt
      prompt_file: prompts/triage.md
      rubric_file: rubrics/triage.md
      test_set:
        id: claim-denials-snf-v3-dev
        items_file: claim-denials-snf-v3.dev.jsonl
      candidate_ids: [sonnet-5, kimi-k3, glm-5.3, deepseek-v4.1-flash, opus-5.5, gpt-5.6-sol, qwen3.8-max, deepseek-v4-pro]
      required_checks: [triage-check]
      judged_dimensions: [sound-action]
      success_criteria:
        mandatory_checks: all
      eligibility:
        minimum_required_check_pass_rate: 0.9
        minimum_reliability: 0.9
      operating_mode: lowest-cost
      maximum_completion_time_seconds: 300

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: glm-5.3
    model: z-ai/glm-5.3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4.1-flash
    model: deepseek/deepseek-v4.1-flash
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: opus-5.5
    model: anthropic/claude-opus-5.5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: gpt-5.6-sol
    model: openai/gpt-5.6-sol
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: qwen3.8-max
    model: qwen/qwen3.8-max-0902
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4-pro
    model: deepseek/deepseek-v4-pro-0813
    provider_route: openrouter
    generation_settings: { temperature: 0 }

evaluators:
  required_checks:
    triage-check:
      kind: command
      description: "Root cause, correctability, next action and deadline match the key computed from RULES.md; the deadline must be the last day the rules allow."
      argv: ["node", "checks/triage-check.mjs"]
      version_files: [checks/triage-check.mjs]
      timeout_seconds: 30
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/triage.md
    methods: [absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/triage.md
  default_temperature: 0
