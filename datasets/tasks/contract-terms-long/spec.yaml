# contract-terms-long — which model still extracts contract terms correctly
# from a long, scanned document packet whose amendments have to be sorted out?
#
# Two hand-written probes (contract-terms-probe, -probe2: twelve short
# agreements with one structural trap each) went 48/48 across four models, and
# the six-item first cut of this set (length and scan noise, two traps) 24/24.
# This cut keeps those six items (ct-001..006, unchanged) and adds 54 built
# the same way, with the traps compounded: chains of four amendments filed
# out of order, an amended and restated agreement that wipes an earlier
# amendment, amendments one party never signed, drafts, amendments that take
# effect after the status date, amendments that remove or add automatic
# renewal or extend the initial term, and agreements with no governing-law,
# cap or fixed-term clause at all (a venue and the SOWs' own laws still name
# states). Packets run 7,000–20,000 words: an agreement of ~30 sections with
# the graded articles in the back half, five schedules and 4–16 SOWs, each
# SOW stating its own term, cap and governing law that do not override the
# agreement. Noise levels: clean, light and heavy OCR damage. Character damage
# never touches a graded value, and gen/generate.mjs asserts each one is still
# in the text. RULES.md states every rule the key applies.
#
# 60 items: 16 ordinary, 44 traps; 24 holdout. The eight candidates are the
# panel the other sets use, so the rows compare.
#
# What it does not test: real-world contract variety (all packets come from
# one clause library) or a wide schema (eight fields).
#
#   node datasets/tasks/contract-terms-long/gen/generate.mjs
#   agenteval check-task datasets/tasks/contract-terms-long          # free
#   caffeinate -i agenteval run datasets/tasks/contract-terms-long --yes --html   # billed, about $35
#
# 2026-11-05 run (runs/contract-terms-long-2026-11-05T07-46-34-295Z): 9 of 60
# inputs separate the eight on the answers, all one-party or chain traps;
# everything else is 100% for every model. datasets/README.md has the row.

protocol_version: "0.3"
run_name: contract-terms-long
description: "Does contract-term extraction hold up on long, scanned document packets whose amendments have to be sorted out? 60 synthetic packets of 7,000–20,000 words (an agreement with the graded articles in its back half, five schedules, 4–16 SOWs with their own terms, caps and laws as distractors) at three scan-noise levels; 44 carry a trap: amendment chains filed out of order, a restatement that supersedes an earlier amendment, unsigned, one-party and future-effective amendments, renewal and term changes, and clauses that are simply absent. Extract eight terms as they stand on the status date."
budget_usd: 70

workflow:
  control_candidate: sonnet-5
  steps:
    - id: extract
      version: "2"
      producer: prompt
      prompt_file: prompts/extract.md
      rubric_file: rubrics/extract.md
      test_set:
        id: contract-terms-long
        labels_file: checks/manifest.json
        inputs: [ct-001, ct-002, ct-003, ct-004, ct-005, ct-006, ct-007, ct-008, ct-009, ct-010, ct-011, ct-012, ct-013, ct-014, ct-015, ct-016, ct-017, ct-018, ct-019, ct-020, ct-021, ct-022, ct-023, ct-024, ct-025, ct-026, ct-027, ct-028, ct-029, ct-030, ct-031, ct-032, ct-033, ct-034, ct-035, ct-036, ct-037, ct-038, ct-039, ct-040, ct-041, ct-042, ct-043, ct-044, ct-045, ct-046, ct-047, ct-048, ct-049, ct-050, ct-051, ct-052, ct-053, ct-054, ct-055, ct-056, ct-057, ct-058, ct-059, ct-060]
      candidate_ids: [sonnet-5, kimi-k3, glm-5.3, deepseek-v4.1-flash, opus-5.5, gpt-5.6-sol, qwen3.8-max, deepseek-v4-pro]
      required_checks: [terms-check]
      judged_dimensions: [faithful]
      success_criteria:
        mandatory_checks: all
      # Traps are the point of this set. A candidate qualifies at 90% of its
      # answers passing the check and 90% of trials completing (a timeout is a
      # trial that did not complete).
      eligibility:
        minimum_required_check_pass_rate: 0.9
        minimum_reliability: 0.9
      operating_mode: lowest-cost
      # Packets of 20,000 words take the slow reasoning models minutes.
      maximum_completion_time_seconds: 600

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: glm-5.3
    model: z-ai/glm-5.3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4.1-flash
    model: deepseek/deepseek-v4.1-flash
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: opus-5.5
    model: anthropic/claude-opus-5.5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: gpt-5.6-sol
    model: openai/gpt-5.6-sol
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: qwen3.8-max
    model: qwen/qwen3.8-max-0902
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4-pro
    model: deepseek/deepseek-v4-pro-0813
    provider_route: openrouter
    generation_settings: { temperature: 0 }

evaluators:
  required_checks:
    terms-check:
      kind: command
      description: "All eight extracted fields match the key the generator computed (binding amendments applied in effective-date order, a restatement superseding what came before it, absent clauses null)."
      argv: ["node", "checks/terms-check.mjs"]
      version_files: [checks/terms-check.mjs, checks/manifest.json]
      timeout_seconds: 30
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/extract.md
    methods: [absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/extract.md
  default_temperature: 0
