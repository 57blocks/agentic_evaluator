# Sample: a two-step chained workflow, fully offline. Free to run.
#
#   agenteval plan examples/tasks/chain-offline
#   agenteval run  examples/tasks/chain-offline --yes --html
#
# What it shows:
#   - `input_from: draft` hands each draft to the review step, which turns on
#     end-to-end validation (protocol §8).
#   - `control_candidate` is the single-model arm the chain is compared
#     against. It is deliberately the broken candidate here, so the run
#     executes BOTH arms and the verdict is `adopt-combination`.
#   - `methods: []` declares no judging, so no model is ever called. GAPS.md
#     records the missing scores as a declaration, not a failure.
#
# The two candidates are local commands (`adapter: agent-cli`): fake-pass
# writes TypeScript that compiles, fake-fail writes a type error. Swap them for
# real agents or models once the shape makes sense.

protocol_version: "0.3"
run_name: chain-offline
budget_usd: 1

workflow:
  control_candidate: fake-fail
  steps:
    - id: draft
      version: "1"
      test_set:
        id: code-v1
        inputs: [code-utils]
      candidate_ids: [fake-pass, fake-fail]
      required_checks: [tsc-noemit]
      judged_dimensions: []
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 30
    - id: review
      version: "1"
      input_from: draft
      test_set:
        id: code-v1
        inputs: [code-utils]
      candidate_ids: [fake-pass, fake-fail]
      required_checks: [tsc-noemit]
      judged_dimensions: []
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 30

candidates:
  - id: fake-pass
    adapter: agent-cli
    cli:
      argv: [node, agents/fake-codegen-agent.mjs]
  - id: fake-fail
    adapter: agent-cli
    cli:
      argv: [node, agents/fake-codegen-agent.mjs, --mode, fail]

evaluators:
  required_checks:
    tsc-noemit:
      kind: tsc
      scaffold_dir: scaffold
  judge:
    # Required by the schema, never called: no method is declared.
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/codegen.md
    methods: []

execution:
  trials_per_case: 1
  concurrency: 2

x-harness:
  producer: codegen
  default_temperature: 0.2
