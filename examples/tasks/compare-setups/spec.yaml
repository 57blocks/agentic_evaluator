# Sample: pick between concrete setups — each candidate is its own agent AND
# its own model. BILLED, and NOT sandboxed — read both warnings first.
#
#   agenteval plan examples/tasks/compare-setups                    # free
#   caffeinate -i agenteval run examples/tasks/compare-setups --yes --html
#
# This answers "which of these setups should we adopt?", not "why did it
# win": agent and model change together, so a result cannot be attributed to
# either. For that, run the two controlled halves first — compare-agents
# (model fixed, agent varies) and compare-agent-models (agent fixed, model
# varies) — then list the best combinations here. Edit `candidate_ids` and
# `candidates` freely; ids may use lowercase letters, digits, "." and "-".
#
# The task and grading are the same as compare-agents: implement a small
# reactive-signals library (inputs/code-reactive.txt); checks/behaviour.mjs
# runs spec.test.ts, all ten behaviours must pass, two trials each, and a
# pairwise judge ranks the setups that passed. Run it from inside the
# repository — the check uses this checkout's tsx.
#
# BILLING. Every agent bills its own provider and the harness cannot see that
# spend: agent-cli cost is recorded as unobserved, the ledger shows $0 for
# generation, and `budget_usd` cannot stop the agents. It does cap the judge:
# 3 pairs × 2 orders = 6 judge calls.
#
# NOT SANDBOXED. Without `cli.image` each agent runs on this machine as you,
# with the flags below approving its commands and edits (see "Isolation" in
# docs/GUIDE.md).
#
# Model ids are each agent's own: `opencode models openrouter` and
# `pi --list-models` list them. Run each argv once by hand first.

protocol_version: "0.4"
run_name: compare-setups
budget_usd: 1

workflow:
  control_candidate: claude-code.sonnet-5
  steps:
    - id: codegen
      version: "1"
      rubric_file: rubrics/codegen.md
      test_set:
        id: reactive-setups-v1
        inputs: [code-reactive]
      candidate_ids: [claude-code.sonnet-5, opencode.deepseek-v4-pro, pi.kimi-k3]
      required_checks: [code-reactive-behaviour]
      judged_dimensions: [meets-spec, correctness, type-quality, simplicity, robustness]
      success_criteria:
        mandatory_checks: all
      operating_mode: judge-preference
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 1800

candidates:
  - id: claude-code.sonnet-5
    adapter: agent-cli
    cli:
      argv: [claude, -p, --model, claude-sonnet-5, --permission-mode, acceptEdits, "{{input}}"]
  - id: opencode.deepseek-v4-pro
    adapter: agent-cli
    cli:
      argv: [opencode, run, --pure, --auto, --model, openrouter/deepseek/deepseek-v4-pro, "{{input}}"]
  - id: pi.kimi-k3
    adapter: agent-cli
    cli:
      argv: [pi, -p, --no-session, --provider, openrouter, --model, moonshotai/kimi-k3, "{{input}}"]

evaluators:
  required_checks:
    code-reactive-behaviour:
      kind: command
      argv: [node, checks/behaviour.mjs]
      version_files: [checks/behaviour.mjs, spec.test.ts]
      timeout_seconds: 180
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/codegen.md
    methods: [pairwise-swap]

execution:
  trials_per_case: 2
  concurrency: 2
  benchmark_mode: capability-neutral
  cache_mode: cold

x-harness:
  producer: codegen
  default_temperature: 0.2
