# Publish the datasets dashboard as a static site on GitHub Pages.
#
# `agenteval dash --export` writes a read-only copy of every task, run and
# report in the datasets workspace; this job runs it on every change to the
# datasets or the dashboard and deploys the result to
# https://57blocks.github.io/agentic_evaluator/ . Nothing is billed: the
# export reads the runs already committed under datasets/tasks/*/runs/.
name: Datasets dashboard

on:
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demo
      - run: pnpm agenteval dash --workspace datasets --export site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
