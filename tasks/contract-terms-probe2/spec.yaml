# contract-terms-probe2 — the first probe (one trap per short agreement) went
# 6/6 for every model, so these six put the trap in how documents and clauses
# relate: defined terms changed by amendment and a term given as an end date
# (h1), three amendments filed out of order that touch the same sections
# (h2), an amended-and-restated agreement with a renamed party (h3), an SOW
# whose own term, cap and law do not override the MSA (h4), a signed
# amendment that takes effect after the packet's status date (h5), and a
# lesser-of cap beside a carve-out cap (h6). Answers are hand-checked; each
# reference's "why" says what decides it.
#
#   agenteval check-task tasks/contract-terms-probe2
#   agenteval run tasks/contract-terms-probe2 --yes --html     # billed, well under $1

protocol_version: "0.3"
run_name: contract-terms-probe2
description: "Six hand-written agreement packets where the trap is in how documents relate: a defined term changed by amendment, amendments filed out of order, an amended-and-restated agreement with a renamed party, an SOW that does not override the MSA, a signed amendment effective after the status date, and a lesser-of cap. Extract eight terms as they stand on the packet's status date."
budget_usd: 1

workflow:
  control_candidate: sonnet-5
  steps:
    - id: extract
      version: "1"
      producer: prompt
      prompt_file: prompts/extract.md
      rubric_file: rubrics/extract.md
      test_set:
        id: contract-terms-probe2
        inputs: [h1-defined-terms, h2-amendments-out-of-order, h3-restated, h4-sow-precedence, h5-future-amendment, h6-lesser-of]
      candidate_ids: [sonnet-5, kimi-k3, glm-5.3, deepseek-v4.1-flash]
      required_checks: [terms-check]
      judged_dimensions: [faithful]
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      maximum_completion_time_seconds: 300

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: glm-5.3
    model: z-ai/glm-5.3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4.1-flash
    model: deepseek/deepseek-v4.1-flash
    provider_route: openrouter
    generation_settings: { temperature: 0 }

evaluators:
  required_checks:
    terms-check:
      kind: command
      description: "All eight extracted fields match the hand-checked key as of the packet status date."
      argv: ["node", "checks/terms-check.mjs"]
      version_files: [checks/terms-check.mjs]
      timeout_seconds: 30
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/extract.md
    methods: [absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/extract.md
  default_temperature: 0
