# agb's whole flow, in one spec: which model should run each step, and does
# the per-step best combination beat one model end to end?
#
#   task-breakdown   .ab/tasks.json, UI_CONTRACT.md   (agb stage-detail)
#   test-design      .ab/test-plan.json               (agb stage-qa)
#   implementation   every task, via `agb run`        (agb stage-code)
#
# Each step is evaluated on its own inputs: real agb projects at the moment
# that step started (fixture/), the same for every model, so a step's result
# does not depend on which model ran the step before.
#
# The end-to-end check (each step's pick chained, against opus-5.5 throughout)
# is off for now. To turn it on: input_from + handoff: workdir on test-design and implementation,
# and a workflow.e2e block (inputs, final_checks: [app-gates], steps, judge).
#
# Every field here is supported (docs/design/agb-flow-gaps.md tracks how).
# Not built yet: the task's files — agents/agb-step.mjs, the fixtures under
# fixture/<step>/, the checks and the rubrics.

protocol_version: "0.3"
run_name: agb-flow
description: "Which model should run each step of agb's flow (task breakdown, test design, implementation), and does the per-step best combination beat one model end to end? Each input is a real agb project at the moment that step began (demo-todo, chessicle and invoice for task breakdown and test design; demo-todo tasks for implementation). Every candidate runs the step through the same wrapper; a check grades the work itself, and a judge compares candidates pairwise."
# Counts what candidates report spending; past it no new trial starts.
budget_usd: 600

workflow:
  steps:
    - id: task-breakdown
      version: "1"
      description: "Task breakdown: turn the PRD, design and API contracts into a task plan (.ab/tasks.json) and a UI contract."
      test_set:
        id: task-breakdown-v1
        inputs: [demo-todo, chessicle, invoice]
        # each input is a directory as well as a text: fixture/<input>/
        # is laid into the work dir before the candidate starts.
        fixture_dir: fixture/task-breakdown
      candidate_ids: &all [opus-5-5, fable-5-1, gpt-5-6-sol, gemini-4-argon, deepseek-v4-pro, deepseek-flash, kimi-k3, glm-5-3, glm-5-3-prime, qwen-3-8-max]
      required_checks: [plan-gates]
      success_criteria: { mandatory_checks: all }
      operating_mode: highest-assurance
      eligibility: { minimum_reliability: 1.0, minimum_required_check_pass_rate: 1.0 }
      maximum_completion_time_seconds: 3000
      # a spend cap per trial, handed to the command as {{max_cost_usd}}.
      max_cost_per_trial_usd: 15
      # per-step judge.
      judge:
        rubric_file: rubrics/breakdown.md
        methods: [pairwise-swap]
        show: [".ab/tasks.json", UI_CONTRACT.md]
        dimensions: [granularity, ordering, clarity, domains]

    - id: test-design
      version: "1"
      description: "Test design: write a test plan (.ab/test-plan.json) that covers every acceptance criterion of the adopted task plan."
      test_set:
        id: test-design-v1
        inputs: [demo-todo, chessicle, invoice]
        fixture_dir: fixture/test-design
      candidate_ids: *all
      required_checks: [test-plan-gates]
      success_criteria: { mandatory_checks: all }
      operating_mode: highest-assurance
      eligibility: { minimum_reliability: 1.0, minimum_required_check_pass_rate: 1.0 }
      maximum_completion_time_seconds: 1800
      # Both plans pass the coverage gate; the judge says whose tests are better.
      judge:
        rubric_file: rubrics/test-plan.md
        methods: [pairwise-swap]
        show: [.ab/test-plan.json]
        dimensions: [coverage, falsifiable, levels, traceable]
      max_cost_per_trial_usd: 10

    - id: implementation
      version: "1"
      description: "Implementation: build one task of the plan with agb run, so the task's own acceptance tests pass."
      test_set:
        id: implementation-v1
        # Two tasks of demo-todo, of two kinds, each from the project as it
        # stood just before it: T-001 starts from nothing (scaffold, server,
        # client, database); T-006 adds the board page to a working codebase.
        # In the chain the step builds every task.
        inputs: [demo-todo-T-001, demo-todo-T-006]
        fixture_dir: fixture/implementation
      candidate_ids: *all
      required_checks: [task-tests]
      # agb fails a task its own gates or verifier would not pass, however the
      # code turned out: a single task leaves later tasks' red tests in the tree
      # (compile gate), and each candidate verifies itself (as strict as it is).
      # The task's own acceptance tests (the check) decide; agb's exit is kept as evidence.
      exit_code: ignore
      success_criteria: { mandatory_checks: all }
      operating_mode: highest-assurance
      eligibility: { minimum_reliability: 1.0, minimum_required_check_pass_rate: 1.0 }
      maximum_completion_time_seconds: 3600
      # The judge reads only what each candidate added or changed (src and
      # tests); `agenteval judge` leaves out files identical to the fixture.
      judge:
        rubric_file: rubrics/code.md
        methods: [pairwise-swap]
        show: ["client/**", "server/**", package.json, "*.config.*", tsconfig.json]
        dimensions: [correctness, structure, tests, scope]
      max_cost_per_trial_usd: 10
      # per-step concurrency. agb run is heavy (installs, builds, a dev
      # server); three at once is what this machine takes.
      concurrency: 3

# One command for every step: agents/agb-step.mjs reads EVAL_STEP and runs the
# matching agb stage (task-breakdown → stage-detail, test-design → stage-qa,
# implementation → stage-code) with the model it is given. argv names the model as the tool
# knows it; `model` is the OpenRouter id agenteval prices its tokens with
# (reports_usage: tokens). Providers are plain env, keys read at run time.
x-providers:
  deepseek: &deepseek
    ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
    ANTHROPIC_API_KEY: ${DEEPSEEK_API_KEY}
    ANTHROPIC_AUTH_TOKEN: ""
  openrouter: &openrouter
    ANTHROPIC_BASE_URL: https://openrouter.ai/api
    ANTHROPIC_AUTH_TOKEN: ${OPENROUTER_API_KEY}
    ANTHROPIC_API_KEY: ""

candidates:
  - id: opus-5-5
    adapter: agent-cli
    model: anthropic/claude-opus-5.5
    cli: { argv: [node, agents/agb-step.mjs, claude-opus-5-5, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs] }
  - id: fable-5-1
    adapter: agent-cli
    model: anthropic/claude-fable-5.1
    cli: { argv: [node, agents/agb-step.mjs, claude-fable-5-1, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs] }
  - id: gpt-5-6-sol
    adapter: agent-cli
    model: openai/gpt-5.6-sol
    cli: { argv: [node, agents/agb-step.mjs, openai/gpt-5.6-sol, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs], env: *openrouter }
  - id: gemini-4-argon
    adapter: agent-cli
    model: google/gemini-4-argon
    cli: { argv: [node, agents/agb-step.mjs, google/gemini-4-argon, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs], env: *openrouter }
  - id: deepseek-v4-pro
    adapter: agent-cli
    model: deepseek/deepseek-v4-pro-0813
    cli: { argv: [node, agents/agb-step.mjs, deepseek-v4-pro, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs], env: *deepseek }
  - id: deepseek-flash
    adapter: agent-cli
    model: deepseek/deepseek-v4.1-flash
    cli: { argv: [node, agents/agb-step.mjs, deepseek-flash, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs], env: *deepseek }
  - id: kimi-k3
    adapter: agent-cli
    model: moonshotai/kimi-k3
    cli: { argv: [node, agents/agb-step.mjs, moonshotai/kimi-k3, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs], env: *openrouter }
  - id: glm-5-3
    adapter: agent-cli
    model: z-ai/glm-5.3
    cli: { argv: [node, agents/agb-step.mjs, z-ai/glm-5.3, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs], env: *openrouter }
  - id: glm-5-3-prime
    adapter: agent-cli
    model: z-ai/glm-5.3-prime
    cli: { argv: [node, agents/agb-step.mjs, z-ai/glm-5.3-prime, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs], env: *openrouter }
  - id: qwen-3-8-max
    adapter: agent-cli
    model: qwen/qwen3.8-max-0902
    cli: { argv: [node, agents/agb-step.mjs, qwen/qwen3.8-max-0902, "{{max_cost_usd}}"], reports_usage: tokens, version_files: [agents/agb-step.mjs], env: *openrouter }

evaluators:
  required_checks:
    plan-gates:
      kind: command
      description: "The task plan claims every page and endpoint in the design and has no cycle between domains."
      argv: [node, checks/plan-gates.mjs]
      version_files: [checks/plan-gates.mjs]
      timeout_seconds: 300
    test-plan-gates:
      kind: command
      description: "The test plan covers every acceptance criterion of the adopted task plan."
      argv: [node, checks/test-plan-gates.mjs]
      version_files: [checks/test-plan-gates.mjs]
      timeout_seconds: 300
    task-tests:
      kind: command
      description: "The task's own acceptance tests, restored from the fixture, all pass."
      argv: [node, checks/task-tests.mjs]
      version_files: [checks/task-tests.mjs]
      timeout_seconds: 900
    app-gates:
      kind: command
      description: "The delivered app installs, builds, and its whole test suite passes under agb smoke."
      argv: [node, checks/app-gates.mjs]
      version_files: [checks/app-gates.mjs]
      timeout_seconds: 2400
  # The judge's vendor must differ from every candidate's; the candidates cover
  # Anthropic, OpenAI, Google, DeepSeek, Moonshot, Zhipu and Qwen.
  judge:
    model: x-ai/grok-4.7
    provider_route: openrouter
    rubric_file: rubrics/breakdown.md
    methods: []

execution:
  trials_per_case: 1
  concurrency: 3
  benchmark_mode: production-realistic
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: codegen
  default_temperature: 0
