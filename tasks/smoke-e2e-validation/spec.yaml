# End-to-end validation smoke (protocol §8 step 3), fully local.
# The declared control writes broken TypeScript, so the single-model control
# arm fails its required check while the proposed combination passes it.
protocol_version: "0.3"
run_name: smoke-e2e-validation
budget_usd: 1

workflow:
  control_candidate: fake-fail
  steps:
    - id: draft
      version: "1"
      test_set:
        id: code-v1
        inputs: [code-utils]
      candidate_ids: [fake-pass, fake-fail]
      required_checks: [tsc-noemit]
      judged_dimensions: [meets-spec, correctness]
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 30
    - id: review
      version: "1"
      input_from: draft
      test_set:
        id: code-v1
        inputs: [code-utils]
      candidate_ids: [fake-pass, fake-fail]
      required_checks: [tsc-noemit]
      judged_dimensions: [meets-spec, correctness]
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 30

candidates:
  - id: fake-pass
    adapter: agent-cli
    cli:
      argv: [node, agents/fake-codegen-agent.mjs]
  - id: fake-fail
    adapter: agent-cli
    cli:
      argv: [node, agents/fake-codegen-agent.mjs, --mode, fail]

evaluators:
  required_checks:
    tsc-noemit:
      kind: tsc
      scaffold_dir: scaffold
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/codegen.md
    methods: [pairwise-swap, absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 1
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: codegen
  default_temperature: 0.2
