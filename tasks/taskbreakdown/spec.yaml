# Generate a task breakdown from one PRD and compare three models.
# This file's sha256 goes into the manifest: changing any character (comments
# included) changes the hash.

protocol_version: "0.4"
run_name: taskbreakdown   # output goes to runs/<run_name>-<timestamp>/
budget_usd: 3             # enforced: the run stops starting new work once spend reaches it

workflow:
  control_candidate: sonnet-5   # the control baseline; the fallback pick when every metric ties

  steps:
    - id: taskbreakdown
      version: "1"              # bump when the task definition changes

      producer: prompt          # prompt (one model call) | codegen (parses file blocks)
      prompt_file: prompts/taskbreakdown.md   # {{input}} is replaced by the input text
      rubric_file: rubrics/taskbreakdown.md   # read by both the judge and the scorer

      test_set:
        id: todolist-prd-v1
        inputs: [todolist.prd]  # -> inputs/todolist.prd.txt

      candidate_ids: [sonnet-5, deepseek-v4-pro, kimi-k3]

      # Empty -> every task_outcome is undetermined -> no mode but judge-preference recommends.
      # With a check, list it here (e.g. [tsc-noemit]) and add success_criteria and eligibility.
      required_checks: []

      judged_dimensions: [granularity, dependencies, verifiability, faithfulness, actionability]

      # lowest-cost | fastest-within-cost-ceiling | highest-assurance | judge-preference
      # With no required check only judge-preference can decide, and the verdict is forced to directional.
      operating_mode: judge-preference

      maximum_completion_time_seconds: 300   # a timeout counts against the candidate, not as a system error

# A candidate = model + route + settings. A different temperature is a different candidate.
# Ids avoid vendor names so the judge cannot recognise its own vendor's output.
candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0.3, max_tokens: 24000 }
  - id: deepseek-v4-pro
    model: deepseek/deepseek-v4-pro
    provider_route: openrouter
    generation_settings: { temperature: 0.3, max_tokens: 24000 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0.3, max_tokens: 24000 }
  # for a local agent candidate see tasks/eval/spec.yaml (adapter: agent-cli)

evaluators:
  # required_checks:
  #   tsc-noemit: { kind: tsc, scaffold_dir: scaffold }   # kind: tsc | command

  judge:
    model: openai/gpt-5.6-sol   # must be a different vendor from every candidate
    provider_route: openrouter
    rubric_file: rubrics/taskbreakdown.md
    # pairwise-swap: judged in both orders, a win counts only when they agree; absolute-1-5: each output scored against anchors
    methods: [pairwise-swap, absolute-1-5]

execution:
  trials_per_case: 2   # pairwise uses each cell's first successful output; repeats feed absolute scoring only
  concurrency: 3

  benchmark_mode: capability-neutral   # every candidate under the same conditions
  cache_mode: cold                     # cost counted as a cold start

  minimum_meaningful_difference: null  # null -> verdict forced to directional; firm also needs >= 10 inputs

# Defaults for the older harness path; redundant where the step already declares them
x-harness:
  producer: prompt
  prompt_file: prompts/taskbreakdown.md
  default_temperature: 0.3
