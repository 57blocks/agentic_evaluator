# kyc-ubo-v2 — which model knows how German KYC works out beneficial owners?
#
# v1 stated its rules in the prompt and every model got 30/30. Here the
# prompt names only § 3 GwG and BVA practice; the rules the answer key follows
# are in RULES.md, each quoted from the statute or the BVA Transparenzregister
# FAQ (Stand 05.05.2023), and the candidate never sees them. Inputs are
# synthetic German register extracts with euro amounts, generated by
# gen/generate.mjs from a fixed seed; gen/solve.mjs computes every answer.
#
# Ten ordinary items and twenty traps: 6.250 vs 6.251 of 25.000, direct and
# controlled stakes added, two controlled vehicles added beside a 50/50
# holding, non-voting shares, own shares left out of the base, the controller
# of a KG's general partner, and the fallback to the Geschäftsführer (not the
# Prokurist). A six-item hand-written probe of this design (kyc-ubo-v2-probe)
# split the models: two of four missed the two-vehicle case.
#
# Graded by script: who the owners and fictitious owners are. The stated basis
# is not graded (one ground is enough, FAQ Teil 1 B I Nr. 9); the judge reads
# it beside the check.
#
#   node tasks/kyc-ubo-v2/gen/generate.mjs     # rebuild the set (same seed, same set)
#   agenteval check-task kyc-ubo-v2            # free
#   agenteval run kyc-ubo-v2 --yes --html      # billed

protocol_version: "0.3"
run_name: kyc-ubo-v2
description: "Which model knows how German KYC identifies a company's beneficial owners (§ 3 GwG as the BVA Transparenzregister applies it)? 30 synthetic German register extracts with euro amounts; the prompt names the law but not its rules, which are in RULES.md, each quoted from the statute or the BVA FAQ. Ten ordinary items and twenty traps: nominal-amount boundaries, direct plus controlled stakes added, two controlled vehicles beside a 50/50 holding, non-voting shares, own shares, a KG's general partner, and the fallback."
budget_usd: 5

workflow:
  control_candidate: sonnet-5
  steps:
    - id: ubo
      version: "1"
      producer: prompt
      prompt_file: prompts/ubo.md
      rubric_file: rubrics/ubo.md
      test_set:
        id: kyc-ubo-v2
        labels_file: checks/manifest.json
        inputs: [ubo2-001, ubo2-002, ubo2-003, ubo2-004, ubo2-005, ubo2-006, ubo2-007, ubo2-008, ubo2-009, ubo2-010, ubo2-011, ubo2-012, ubo2-013, ubo2-014, ubo2-015, ubo2-016, ubo2-017, ubo2-018, ubo2-019, ubo2-020, ubo2-021, ubo2-022, ubo2-023, ubo2-024, ubo2-025, ubo2-026, ubo2-027, ubo2-028, ubo2-029, ubo2-030]
      candidate_ids: [sonnet-5, kimi-k3, glm-5.3, deepseek-v4.1-flash]
      required_checks: [ubo-check]
      judged_dimensions: [correct-basis, reasoning-clarity]
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      # glm-5.3 timed out at 180s on two probe items; give reasoning room.
      maximum_completion_time_seconds: 300

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: glm-5.3
    model: z-ai/glm-5.3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4.1-flash
    model: deepseek/deepseek-v4.1-flash
    provider_route: openrouter
    generation_settings: { temperature: 0 }

evaluators:
  required_checks:
    ubo-check:
      kind: command
      description: "The set of beneficial owners and of fictitious beneficial owners matches the key computed from RULES.md, by name; the stated basis is left to the judge."
      argv: ["node", "checks/ubo-check.mjs"]
      version_files: [checks/ubo-check.mjs, checks/manifest.json]
      timeout_seconds: 30
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/ubo.md
    methods: [absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/ubo.md
  default_temperature: 0
