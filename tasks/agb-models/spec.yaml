# Which model agb should use for each of two steps: task breakdown and coding.
#
# Every candidate is "agb + one model" (.abrc.json's spec / coding / escalation
# tiers all set to it); only the model changes. Inputs come from an agb
# project's git history via scripts/harvest.mjs:
#
#   detail  the state just before the commit that wrote .ab/tasks.json (PRD,
#           design and contracts in place, no task breakdown yet)
#           -> claude -p + the stage-detail skill (by design agb has no CLI
#              command for this step)
#   code    the state just before each [T-xxx] commit (earlier tasks done,
#           this one is next)
#           -> agb run, with the plan trimmed to this one task
#
# Success:
#   detail  a parseable task table, and zero findings from agb's coverage and
#           structure gates (page-coverage / contract-coverage /
#           plan-domain-cycle); heuristic gates are only counted
#   code    the acceptance tests the plan lists for this task, restored to
#           their original form, all pass
#
# The spend cap lives in agents/agb.mjs: $10 per run (agb estimates $2.46 per
# task, at most $6.16 with retries). An agent candidate's spend shows as 0 in
# the ledger, so the operating mode is highest-assurance.
# A real run spends real money and runs candidates on this machine. Start with
# `pnpm agenteval plan agb-models`.
protocol_version: "0.3"
run_name: agb-models

workflow:
  control_candidate: agb-sonnet-5
  steps:
    - id: detail
      version: "1"
      test_set:
        id: detail-v1
        inputs: [demo-todo-detail]
      candidate_ids: [agb-opus-5, agb-opus-5-5, agb-sonnet-5]
      required_checks: [plan-gates]
      success_criteria:
        mandatory_checks: all
      operating_mode: highest-assurance
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 1800
    - id: code
      version: "1"
      test_set:
        id: code-v1
        inputs: [demo-todo-T-001, demo-todo-T-002, demo-todo-T-003, demo-todo-T-004, demo-todo-T-005, demo-todo-T-006, demo-todo-T-007, demo-todo-T-008]
      candidate_ids: [agb-opus-5, agb-opus-5-5, agb-sonnet-5]
      required_checks: [task-tests]
      success_criteria:
        mandatory_checks: all
      operating_mode: highest-assurance
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 2400

candidates:
  - id: agb-opus-5
    adapter: agent-cli
    cli:
      argv: [node, agents/agb.mjs, claude-opus-5]
  - id: agb-opus-5-5
    adapter: agent-cli
    cli:
      argv: [node, agents/agb.mjs, claude-opus-5-5]
  - id: agb-sonnet-5
    adapter: agent-cli
    cli:
      argv: [node, agents/agb.mjs, claude-sonnet-5]

evaluators:
  required_checks:
    plan-gates:
      kind: command
      argv: ["node", "checks/plan-gates.mjs"]
      version_files: [checks/plan-gates.mjs]
      timeout_seconds: 300
    task-tests:
      kind: command
      argv: ["node", "checks/task-tests.mjs"]
      version_files: [checks/task-tests.mjs]
      timeout_seconds: 600
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/none.md
    # No judge: a candidate's "output" is the executor's terminal log, and
    # comparing those pairwise means nothing.
    methods: []

execution:
  trials_per_case: 1
  concurrency: 1
  benchmark_mode: production-realistic
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: codegen
  default_temperature: 0
