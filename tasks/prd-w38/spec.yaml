# Three independent steps (no handoff): PRD from a feature brief, task
# breakdown from a frozen compact PRD, then codegen from frozen code specs.
# Prior-step output is not piped forward. PRD / taskbreakdown have no
# required check (task_outcome stays undetermined). Codegen gates on tsc.

protocol_version: "0.3"
run_name: prd-w38
budget_usd: 22

workflow:
  control_candidate: sonnet-5
  steps:
    - id: prd
      version: "1"
      producer: prompt
      prompt_file: prompts/prd.md
      rubric_file: rubrics/prd.md
      test_set:
        id: briefs-v1
        inputs: [todo-app, chat-app]
      candidate_ids: [sonnet-5, deepseek-v4-pro, kimi-k3]
      required_checks: []
      judged_dimensions: [completeness, testability, no-hallucination, structure]
      operating_mode: highest-assurance
      maximum_completion_time_seconds: 240
    - id: taskbreakdown
      version: "1"
      producer: prompt
      prompt_file: prompts/taskbreakdown.md
      rubric_file: rubrics/taskbreakdown.md
      test_set:
        id: compact-prd-v1
        inputs: [todo-app.tb, chat-app.tb]
      candidate_ids: [sonnet-5, deepseek-v4-pro, kimi-k3]
      required_checks: []
      judged_dimensions: [granularity, dependencies, verifiability, faithfulness, actionability]
      operating_mode: highest-assurance
      maximum_completion_time_seconds: 240
    - id: codegen
      version: "1"
      producer: codegen
      rubric_file: rubrics/codegen.md
      test_set:
        id: code-v1
        inputs: [code-utils, code-component, code-schema]
      candidate_ids: [sonnet-5, deepseek-v4-pro, kimi-k3]
      required_checks: [tsc-noemit]
      judged_dimensions: [meets-spec, correctness, type-quality, simplicity, robustness]
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      eligibility:
        minimum_reliability: 1.0
        minimum_required_check_pass_rate: 1.0
      maximum_completion_time_seconds: 180

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0.3 }
  - id: deepseek-v4-pro
    model: deepseek/deepseek-v4-pro
    provider_route: openrouter
    generation_settings: { temperature: 0.3 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0.3 }

evaluators:
  required_checks:
    tsc-noemit:
      kind: tsc
      scaffold_dir: scaffold
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/prd.md
    methods: [pairwise-swap, absolute-1-5]

execution:
  trials_per_case: 2
  concurrency: 3
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/prd.md
  default_temperature: 0.3
