# kyc-ubo-v1 — which model can work out beneficial owners for corporate KYC?
#
# 30 synthetic ownership structures (inputs/), generated by gen/generate.mjs
# from a fixed seed. The answer key (references/) is computed by
# gen/solve.mjs from the rules stated in the prompt, so every answer follows
# from the input and the rules. Each kind of case is a known way to get it
# wrong: a holder at exactly 25%, an owner through control whose multiplied
# stake is below 25%, a multiplied stake above 25% without control, a
# controlled company that holds too little, a three-layer chain, and the
# managing-director fallback. checks/manifest.json gives each item's tags and
# split (dev / holdout); the check prints them with its verdict.
#
# Graded by script only: owners, basis and fallback. The judge reads the
# reasoning and is reported beside it; the pick is the cheapest model that
# passes every item.
#
#   node tasks/kyc-ubo-v1/gen/generate.mjs     # rebuild the set (same seed, same set)
#   agenteval check-task kyc-ubo-v1            # free
#   agenteval run kyc-ubo-v1 --yes --html      # billed

protocol_version: "0.3"
run_name: kyc-ubo-v1
budget_usd: 3

workflow:
  control_candidate: sonnet-5
  steps:
    - id: ubo
      version: "1"
      producer: prompt
      prompt_file: prompts/ubo.md
      rubric_file: rubrics/ubo.md
      test_set:
        id: kyc-ubo-v1
        inputs:
          - ubo-001
          - ubo-002
          - ubo-003
          - ubo-004
          - ubo-005
          - ubo-006
          - ubo-007
          - ubo-008
          - ubo-009
          - ubo-010
          - ubo-011
          - ubo-012
          - ubo-013
          - ubo-014
          - ubo-015
          - ubo-016
          - ubo-017
          - ubo-018
          - ubo-019
          - ubo-020
          - ubo-021
          - ubo-022
          - ubo-023
          - ubo-024
          - ubo-025
          - ubo-026
          - ubo-027
          - ubo-028
          - ubo-029
          - ubo-030
      candidate_ids: [sonnet-5, kimi-k3, glm-5.3, deepseek-v4.1-flash]
      required_checks: [ubo-check]
      judged_dimensions: [correct-basis, reasoning-clarity]
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      maximum_completion_time_seconds: 120

candidates:
  - id: sonnet-5
    model: anthropic/claude-sonnet-5
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: kimi-k3
    model: moonshotai/kimi-k3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: glm-5.3
    model: z-ai/glm-5.3
    provider_route: openrouter
    generation_settings: { temperature: 0 }
  - id: deepseek-v4.1-flash
    model: deepseek/deepseek-v4.1-flash
    provider_route: openrouter
    generation_settings: { temperature: 0 }

evaluators:
  required_checks:
    ubo-check:
      kind: command
      argv: ["node", "checks/ubo-check.mjs"]
      version_files: [checks/ubo-check.mjs, checks/manifest.json]
      timeout_seconds: 30
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/ubo.md
    methods: [absolute-1-5]

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: prompt
  prompt_file: prompts/ubo.md
  default_temperature: 0
