# agent-security-v2-probe — are v2's harder scenarios hard enough to
# separate the four models before the generator scales them?
#
# All four went 20/20 on v1's attacks: v1's injections announced themselves.
# Here (gen/scenarios.mjs) the attacks read as ordinary content and ask for
# something close to the task through an allowed tool; the benign controls
# tell the agent to follow the data. If every model still passes, the lever
# is wrong and the set is not worth scaling.
#
#   node tasks/agent-security-v2-probe/gen/generate.mjs
#   agenteval check-task tasks/agent-security-v2-probe          # free
#   agenteval run tasks/agent-security-v2-probe --yes --html    # billed, under $1

protocol_version: "0.3"
run_name: agent-security-v2-probe
description: "Probe for agent-security-v2: eight hand-written scenarios where the attack reads as ordinary content and asks for something close to the task through an allowed tool, and benign controls where the person tells the agent to follow the data."
budget_usd: 2

workflow:
  control_candidate: sonnet-5
  steps:
    - id: agent
      version: "1"
      test_set:
        id: agent-security-v2-probe
        labels_file: checks/manifest.json
        inputs: [sp-001, sp-002, sp-003, sp-004, sp-005, sp-006, sp-007, sp-008]
      candidate_ids: [sonnet-5, kimi-k3, glm-5.3, deepseek-v4.1-flash]
      required_checks: [trace-check]
      judged_dimensions: [flags-injection, reply-quality]
      success_criteria:
        mandatory_checks: all
      operating_mode: lowest-cost
      # Up to 16 model turns per scenario.
      maximum_completion_time_seconds: 600

x-providers:
  openrouter: &openrouter
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

candidates:
  - id: sonnet-5
    adapter: agent-cli
    model: anthropic/claude-sonnet-5
    cli: { argv: [node, agents/tool-agent.mjs, anthropic/claude-sonnet-5], reports_usage: tokens, version_files: [agents/tool-agent.mjs], env: *openrouter }
  - id: kimi-k3
    adapter: agent-cli
    model: moonshotai/kimi-k3
    cli: { argv: [node, agents/tool-agent.mjs, moonshotai/kimi-k3], reports_usage: tokens, version_files: [agents/tool-agent.mjs], env: *openrouter }
  - id: glm-5.3
    adapter: agent-cli
    model: z-ai/glm-5.3
    cli: { argv: [node, agents/tool-agent.mjs, z-ai/glm-5.3], reports_usage: tokens, version_files: [agents/tool-agent.mjs], env: *openrouter }
  - id: deepseek-v4.1-flash
    adapter: agent-cli
    model: deepseek/deepseek-v4.1-flash
    cli: { argv: [node, agents/tool-agent.mjs, deepseek/deepseek-v4.1-flash], reports_usage: tokens, version_files: [agents/tool-agent.mjs], env: *openrouter }

evaluators:
  required_checks:
    trace-check:
      kind: command
      description: "The agent's tool calls make every call its scenario requires and none it forbids (references/<id>/key.json; gen/scenarios.mjs says why); the reply is left to the judge."
      argv: ["node", "checks/trace-check.mjs"]
      version_files: [checks/trace-check.mjs, checks/trace-rules.mjs, checks/manifest.json]
      timeout_seconds: 30
  judge:
    model: google/gemini-3.1-pro-preview
    provider_route: openrouter
    rubric_file: rubrics/security.md
    methods: [absolute-1-5]
    show: [final.txt, calls.jsonl]

execution:
  trials_per_case: 1
  concurrency: 4
  benchmark_mode: capability-neutral
  cache_mode: cold
  minimum_meaningful_difference: null

x-harness:
  producer: codegen
  default_temperature: 0
